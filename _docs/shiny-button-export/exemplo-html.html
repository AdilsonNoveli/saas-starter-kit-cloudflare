<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiny Button - Exemplo HTML Puro</title>
    
    <style>
        /* ============================================
           CONFIGURAÇÃO BASE (OBRIGATÓRIA)
           ============================================ */
        
        :root {
            /* IMPORTANTE: Defina a cor de fundo do botão */
            --background: #ffffff; /* Branco para light mode */
        }
        
        /* Dark mode (opcional) */
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #1a1a1a; /* Escuro para dark mode */
            }
            body {
                background: #1a1a1a;
                color: #ffffff;
            }
        }
        
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 2rem;
            padding: 2rem;
            background: #f5f5f5;
        }
        
        /* Estilos base do botão */
        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        
        /* ============================================
           ESTILOS DO SHINY BUTTON
           Cole o conteúdo de shiny-button.css aqui
           ou importe: <link rel="stylesheet" href="shiny-button.css">
           ============================================ */
    </style>
    
    <!-- IMPORTE O CSS DO BOTÃO AQUI -->
    <link rel="stylesheet" href="shiny-button.css">
</head>
<body>
    
    <h1>Exemplos de Shiny Button</h1>
    
    <!-- ============================================
         EXEMPLO 1: BÁSICO
         ============================================ -->
    <button class="shiny-button" style="padding: 0.875rem 2rem; font-size: 0.875rem; font-weight: 700; text-transform: uppercase;">
        <span>Botão Básico</span>
    </button>
    
    <!-- ============================================
         EXEMPLO 2: COM ÍCONE
         ============================================ -->
    <button class="shiny-button" style="padding: 0.875rem 2rem; font-size: 0.875rem; font-weight: 700; text-transform: uppercase; border-radius: 0.75rem;">
        <span style="display: flex; align-items: center; gap: 0.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
            </svg>
            <span>Com Ícone</span>
        </span>
    </button>
    
    <!-- ============================================
         EXEMPLO 3: VERDE
         ============================================ -->
    <button class="shiny-button shiny-green" style="padding: 0.875rem 2rem; font-size: 0.875rem; font-weight: 700; text-transform: uppercase;">
        <span>Botão Verde</span>
    </button>
    
    <!-- ============================================
         EXEMPLO 4: ROXO
         ============================================ -->
    <button class="shiny-button shiny-purple" style="padding: 0.875rem 2rem; font-size: 0.875rem; font-weight: 700; text-transform: uppercase;">
        <span>Botão Roxo</span>
    </button>
    
    <!-- ============================================
         EXEMPLO 5: VERMELHO
         ============================================ -->
    <button class="shiny-button shiny-red" style="padding: 0.875rem 2rem; font-size: 0.875rem; font-weight: 700; text-transform: uppercase;">
        <span>Botão Vermelho</span>
    </button>
    
    <!-- ============================================
         EXEMPLO 6: ROUNDED (não pill)
         ============================================ -->
    <button class="shiny-button" style="padding: 0.875rem 2rem; font-size: 0.875rem; font-weight: 700; text-transform: uppercase; border-radius: 0.75rem;">
        <span>Arredondado (não pill)</span>
    </button>
    
    <!-- ============================================
         EXEMPLO 7: GRANDE
         ============================================ -->
    <button class="shiny-button" style="padding: 1.25rem 3rem; font-size: 1rem; font-weight: 700; text-transform: uppercase;">
        <span>Botão Grande</span>
    </button>
    
    <!-- ============================================
         EXEMPLO 8: PEQUENO
         ============================================ -->
    <button class="shiny-button" style="padding: 0.5rem 1rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;">
        <span>Pequeno</span>
    </button>
    
    <!-- ============================================
         EXEMPLO 9: LINK (tag <a>)
         ============================================ -->
    <a href="#" class="shiny-button" style="padding: 0.875rem 2rem; font-size: 0.875rem; font-weight: 700; text-transform: uppercase; text-decoration: none; color: inherit; display: inline-block;">
        <span>Link com Efeito</span>
    </a>
    
    <div style="margin-top: 2rem; text-align: center; max-width: 600px; color: #666;">
        <h3>📝 Instruções:</h3>
        <ol style="text-align: left; line-height: 1.8;">
            <li>Copie o arquivo <code>shiny-button.css</code></li>
            <li>Importe no seu HTML ou CSS</li>
            <li>Use a classe <code>.shiny-button</code></li>
            <li>SEMPRE envolva o conteúdo com <code>&lt;span&gt;</code></li>
            <li>Defina <code>--background</code> no <code>:root</code></li>
        </ol>
    </div>
    
</body>
</html>
