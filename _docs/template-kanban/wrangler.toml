#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers — configuração base da instância hospedada por nós.
# Deploy: `pnpm run deploy` (faz NITRO_PRESET=cloudflare-durable nuxt build →
# `predeploy` garante as Queues abaixo via scripts/ensure-cf-queues.mjs →
# wrangler deploy). No pipeline de Git da Cloudflare (Deploy command
# configurado no dashboard, não passa por este `package.json`), rodar
# `pnpm run cf:ensure-queues && npx wrangler deploy` — ver scripts/README.md.
# Guia completo (secrets, R2, domínio): cloudflare/README.md
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

# INSTALAÇÕES SEPARADAS (não é SaaS): um Worker + um Supabase por loja.
#
# MODELO: este repositório é a aplicação MESTRE. Cada cliente tem seu PRÓPRIO
# fork/repositório (não branch, não o mesmo repo) conectado ao próprio Worker
# no dashboard da Cloudflare. Por isso `name` pode ser um literal fixo aqui —
# no fork do cliente, troque só esta linha para o nome do Worker DELE (tem
# que bater com o nome cadastrado no dashboard Cloudflare daquela conta, ou o
# Workers Builds recusa o build). CLOUDFLARE_WORKER_NAME (env var) continua
# controlando só o prefixo das filas (bloco de queues abaixo).
#
# Propagar uma funcionalidade da mestre pra um cliente: no fork do cliente,
# `git remote add mestre <url-deste-repo>` uma vez, depois `git fetch mestre`
# + `git cherry-pick <sha>` (ou merge de uma branch específica) só do que
# aquele cliente pediu — nunca `git merge mestre/main` inteiro, isso traria
# a config de outros clientes junto.

name = "pedped-core"
compatibility_date = "2025-07-15"

# nodejs_compat: requerido por jsonwebtoken, @aws-sdk e afins sobre o runtime workerd.
# Docs: https://developers.cloudflare.com/workers/runtime-apis/nodejs
compatibility_flags = ["nodejs_compat"]

# IMPORTANTE: NÃO definir `main` nem `[assets]` aqui. O preset cloudflare-module
# do Nitro injeta ambos automaticamente em .output/server/wrangler.json (mesclando
# ESTE arquivo). Defini-los manualmente faz o Nitro emitir warning e ignorá-los.

# SEM ISTO, TODO `wrangler deploy` APAGA "Variáveis e segredos" DO DASHBOARD.
# O `wrangler.toml` não declara `[vars]` de propósito (cloudflare/README.md
# §Secrets: as não-secretas vão em Settings → Variables and Secrets do
# dashboard, não aqui). Por padrão o Wrangler trata este arquivo como fonte
# única da verdade e, a cada deploy, REMOVE qualquer var/secret que exista no
# Worker mas não esteja declarada aqui — isso vale tanto para o que foi
# cadastrado pelo dashboard quanto para secrets de `wrangler secret put` de
# antes. `keep_vars = true` desliga esse comportamento: o deploy passa a só
# atualizar o código, sem tocar nas vars/secrets já configuradas no Worker.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#keep_vars
keep_vars = true

[observability]
enabled = true

# Cron Triggers — acionam o scheduled handler do Worker gerado pelo Nitro.
# O Nitro roteia cada expressão para a(s) task(s) mapeadas em nuxt.config
# scheduledTasks. Docs: https://developers.cloudflare.com/workers/configuration/cron-triggers/
#
# NÃO COMENTE ESTE BLOCO. Nosso modelo é de INSTALAÇÕES SEPARADAS (um Worker por
# loja), e Worker normal aceita cron trigger — a restrição de Cloudflare for
# Platforms (User Workers / Dispatch Namespaces) não se aplica aqui. Comentar
# desliga `webhook:drain`, que roda de minuto em minuto, e a falha é silenciosa
# (§5, armadilha 5). Se algum ambiente específico não puder ter triggers, use a
# flag DISABLE_CRON_TRIGGERS=true — `scripts/ensure-cf-queues.mjs` remove o bloco
# só naquele deploy, sem mexer neste arquivo.
[triggers]
crons = [
  "* * * * *",   # webhook:drain  — drena webhook_outbox todo minuto
  "0 * * * *",   # orders:archive — arquiva pedidos elegíveis toda hora
  "*/15 * * * *",  # agent:evaluate — LLM-as-a-Judge, amostra de turnos a cada 15 min
]

# Secrets — definir via CLI, nunca versionar (lista completa em cloudflare/README.md):
#   wrangler secret put NUXT_SUPABASE_SECRET_KEY
#   (o token e a chave de assinatura do webhook de saída NÃO entram aqui —
#    ficam no Supabase Vault, configurados em Configurações → Webhooks)
#   wrangler secret put NUXT_WHATSAPP_WEBHOOK_TOKEN
#   wrangler secret put NUXT_WHATSAPP_API_TOKEN

# Agente WhatsApp in-app (_docs/arquitetura-agente-whatsapp-in-app.md, seção
# 2/10). O produtor (POST /api/whatsapp/webhook, passo 7 da seção 12) grava o
# buffer de rajada e agenda o claim com `delaySeconds=8`; o consumer (hook
# nativo `cloudflare:queue` do Nitro, `server/plugins/whatsapp-queue.ts`) roda
# o loop do agente. `max_batch_size`/`max_concurrency` limitam o throughput de
# chamadas concorrentes à OpenAI; `max_retries`+DLQ cobrem falha permanente
# (o handler em si nunca relança exceção de negócio — só falha catastrófica
# antes do claim aciona retry real).
#
# As duas filas abaixo (produtor + DLQ) NÃO são criadas pelo `wrangler
# deploy` — são recurso de conta, precisam existir de antemão
# (`wrangler queues create`). `scripts/ensure-cf-queues.mjs` faz isso de
# forma idempotente a cada deploy (lê os nomes direto daqui, nunca hardcoded)
# — nunca crie fila nova só editando este arquivo sem rodar o script/deploy
# em seguida.
# ⚠️ AS FILAS USAM O PLACEHOLDER `{{WORKER_NAME}}` — NÃO O SUBSTITUA À MÃO, E
# ESTE ARQUIVO NUNCA É REESCRITO PELO SCRIPT (corrigido em 2026-08-03, item 5
# da §8.18 de `_docs/em-andamento.md`): `scripts/ensure-cf-queues.mjs` resolve
# o placeholder só EM MEMÓRIA (para extrair os nomes de fila e criar as que
# faltarem) e no arquivo GERADO `.output/server/wrangler.json` — nunca aqui.
# Antes disso, o script reescrevia este arquivo em disco a cada
# `pnpm run deploy`, e um `git add`/commit logo depois apagaria o mecanismo:
# **Cloudflare Queues são escopadas por CONTA**, e a instalação seguinte
# herdaria as filas da anterior — duas lojas no mesmo Worker de fila, mensagem
# de uma processada pelo Worker da outra. Já aconteceu (§8.1/§8.2 de
# `_docs/em-andamento.md`). Há guard de teste que falha se o placeholder sumir
# daqui.
#
# Para cada nova instalação, defina CLOUDFLARE_WORKER_NAME nas variáveis do
# Workers Builds — sem editar este arquivo. Sem a variável, o script usa o campo
# `name` acima como fallback.
[[queues.producers]]
queue = "{{WORKER_NAME}}-turno-check"
binding = "WHATSAPP_QUEUE"

[[queues.consumers]]
queue = "{{WORKER_NAME}}-turno-check"
max_batch_size = 10
max_batch_timeout = 2
max_concurrency = 5
max_retries = 3
dead_letter_queue = "{{WORKER_NAME}}-turno-check-dlq"

# Mídia recebida (áudio/imagem) — seção 8.1 de
# _docs/implementar/arquitetura-midia-e-provedor-whatsapp.md. Fila separada da
# do turno de propósito (§5.1): o turno tem 8s de debounce de rajada e mídia
# quer começar já, e uma falha de transcrição não pode entrar no retry do turno
# e re-executar o loop do agente.
#
# `max_concurrency = 3` é o teto de gasto SIMULTÂNEO com a OpenAI de mídia,
# independente do volume de texto — a razão principal de a fila ser separada.
# `max_retries = 2` (contra 3 do turno) porque cada tentativa custa dinheiro; a
# terceira raramente resolve o que as duas primeiras não resolveram. A DLQ não
# tem consumer: é registro para inspeção manual, não processamento automático.
# A mensagem carrega só identificadores, nunca os bytes (teto de 128 KB, §5.1).
[[queues.producers]]
queue = "{{WORKER_NAME}}-midia"
binding = "WHATSAPP_MIDIA_QUEUE"

[[queues.consumers]]
queue = "{{WORKER_NAME}}-midia"
max_batch_size = 5
max_batch_timeout = 1
max_concurrency = 3
max_retries = 2
dead_letter_queue = "{{WORKER_NAME}}-midia-dlq"

# Laboratório de avaliação sob demanda
# (`_docs/implementar/prd-laboratorio-avaliacao-agente.md` §6/§7) — uma
# mensagem por persona (6 por corrida). `max_batch_size = 1` de propósito: cada
# invocação já roda uma conversa simulada inteira (~4 turnos + 1 julgamento,
# ~5 chamadas sequenciais à OpenAI) e não há benefício em agrupar personas no
# mesmo batch. `max_retries = 1`: falha de uma persona não deveria consumir
# múltiplas tentativas de LLM pagas — a corrida grava `status='failed'` para
# aquela persona e segue; a DLQ existe para inspeção manual, sem consumer.
[[queues.producers]]
queue = "{{WORKER_NAME}}-lab"
binding = "WHATSAPP_LAB_QUEUE"

[[queues.consumers]]
queue = "{{WORKER_NAME}}-lab"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 3
max_retries = 1
dead_letter_queue = "{{WORKER_NAME}}-lab-dlq"

# Envio manual do painel do Chat (`_docs/CHAT/PRD.md` §6.3, resolve G5/G6) —
# mesmo padrão de outbox do `webhook_outbox`/`worker.ts`, mas via Queue em vez
# de polling por cron: a mensagem nasce `pending` em `whatsapp_conversas`
# (`chatService.dispatchOutboundMessage`) e só o consumer, depois de uma
# resposta REAL da Cloud API, grava `sent`/`failed` — nunca mais "entregue"
# sem confirmação, e o `wamid` fica registrado para dedupe contra o echo do
# celular (G6). `max_batch_size` baixo e `max_concurrency` modesto: volume de
# envio manual é ordens de magnitude menor que tráfego inbound, e cada envio é
# uma chamada à Cloud API que vale a pena não paralelizar demais.
[[queues.producers]]
queue = "{{WORKER_NAME}}-chat-outbound"
binding = "CHAT_OUTBOUND_QUEUE"

[[queues.consumers]]
queue = "{{WORKER_NAME}}-chat-outbound"
max_batch_size = 5
max_batch_timeout = 1
max_concurrency = 3
max_retries = 3
dead_letter_queue = "{{WORKER_NAME}}-chat-outbound-dlq"

# Durable Object nativa do Nitro (preset `cloudflare-durable`) — dá suporte a
# `defineWebSocketHandler` (h3/crossws) sem eu escrever nenhuma classe DO:
# `server/api/admin/chat/socket.ts` é o único consumidor hoje, substituindo o
# WebSocket do Supabase Realtime por questão de custo (`_docs/CHAT/PRD.md`,
# decisão "socket único reutilizável"). A classe `$DurableObject` e o binding
# de mesmo nome são gerados pelo PRÓPRIO Nitro
# (`nitropack/dist/presets/cloudflare/runtime/cloudflare-durable.mjs`,
# `DURABLE_BINDING = "$DurableObject"`, `DURABLE_INSTANCE = "server"`) — não
# existe arquivo `class_name` correspondente neste repositório para procurar;
# ele é injetado no entry gerado em `.output/server/index.mjs` quando
# `NITRO_PRESET=cloudflare-durable` (`package.json` → `build:cf`). Uma única
# instância (`idFromName('server')`) para toda a aplicação, hibernatável —
# não cobra pelo tempo ocioso da conexão, só quando há mensagem de fato.
[[durable_objects.bindings]]
name = "$DurableObject"
class_name = "$DurableObject"

[[migrations]]
tag = "v1-realtime-socket"
new_sqlite_classes = ["$DurableObject"]

# Rate Limiting nativo do Workers (§6 do AUDITORIA.md — substitui LRUCache
# por isolado, que dava contador independente em cada isolado dentro do
# MESMO PoP). `namespace_id` é só um inteiro único NESTA CONTA, escolhido
# localmente — não existe `wrangler ratelimit create`, a declaração abaixo
# já é suficiente, sem provisionamento prévio.
#
# Limitação aceita (documentada em server/middleware/1.rate-limit.ts): o
# contador é por localização de borda da Cloudflare, não global entre PoPs
# distantes. `period` só aceita 10 ou 60 (segundos) — por isso todo bucket
# abaixo usa janela de 60s.
[[ratelimits]]
name = "RATE_LIMITER_PUBLIC"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_ADMIN"
namespace_id = "1002"
simple = { limit = 1200, period = 60 }

# Rate limiter dedicado do BFF de mapas (server/utils/maps/rateLimit.ts) —
# protege chamadas PAGAS à Google Maps Platform, teto bem mais baixo que o
# global. Um bucket por rota (autocomplete/place/geocode).
[[ratelimits]]
name = "RATE_LIMITER_MAPS_AUTOCOMPLETE"
namespace_id = "1003"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_MAPS_PLACE"
namespace_id = "1004"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_MAPS_GEOCODE"
namespace_id = "1005"
simple = { limit = 15, period = 60 }

# Recursos opcionais (descomentar quando necessário):

# KV Namespaces (cache distribuído)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "seu-kv-namespace-id"

# R2 Buckets (object storage — imagens de loja/produtos)
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "pedped-uploads"

# D1 Database (SQLite edge)
# [[d1_databases]]
# binding = "DB"
# database_name = "pedped-db"
# database_id = "seu-database-id"
