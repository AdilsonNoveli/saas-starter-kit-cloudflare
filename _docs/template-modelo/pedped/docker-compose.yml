services:
  app:
    image: ${DOCKER_IMAGE:-sales-commerce:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # ── Supabase (nomes com prefixo NUXT_PUBLIC_ são os canônicos — ver .env) ─
      NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL}
      NUXT_PUBLIC_SUPABASE_KEY: ${NUXT_PUBLIC_SUPABASE_KEY}
      NUXT_SUPABASE_SECRET_KEY: ${NUXT_SUPABASE_SECRET_KEY}

      # ── URL pública da aplicação (obrigatória: resolveSiteUrl lança se vazia) ─
      NUXT_SITE_URL: ${NUXT_SITE_URL}

      # ── Webhook de saída (segredos ficam no Supabase Vault, não em env — ver
      #    migration 103) + cron interno + agente WhatsApp in-app ─────────────
      NUXT_WORKER_TOKEN: ${NUXT_WORKER_TOKEN}
      NUXT_WHATSAPP_WEBHOOK_TOKEN: ${NUXT_WHATSAPP_WEBHOOK_TOKEN}
      NUXT_WHATSAPP_API_TOKEN: ${NUXT_WHATSAPP_API_TOKEN}

      # ── Google Maps ───────────────────────────────────────────────────────
      NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NUXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      NUXT_GOOGLE_MAPS_SERVER_KEY: ${NUXT_GOOGLE_MAPS_SERVER_KEY}

      # ── JWT ───────────────────────────────────────────────────────────────
      NUXT_JWT_SECRET: ${NUXT_JWT_SECRET}

      # ── Storage S3-compatível (Cloudflare R2 / AWS S3 / MinIO) ───────────
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_AVATAR_BUCKET_NAME: ${S3_AVATAR_BUCKET_NAME}
      S3_ATTACHMENTS_BUCKET_NAME: ${S3_ATTACHMENTS_BUCKET_NAME}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
