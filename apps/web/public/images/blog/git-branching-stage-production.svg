<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="400" cy="180" r="320" fill="url(#glow)" />

  <!-- Decorative geometry -->
  <g opacity="0.12" stroke="#10b981" stroke-width="1.5" fill="none">
    <circle cx="720" cy="80" r="140" />
    <circle cx="720" cy="80" r="90" />
    <polygon points="60,380 120,280 180,380" />
    <rect x="80" y="40" width="100" height="100" rx="20" />
  </g>

  <!-- Branch diagram: stage -> production -->
  <g transform="translate(0, 70)">
    <!-- stage line -->
    <line x1="150" y1="60" x2="650" y2="60" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" />
    <circle cx="190" cy="60" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <circle cx="290" cy="60" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <circle cx="390" cy="60" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <circle cx="490" cy="60" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <circle cx="590" cy="60" r="9" fill="#38bdf8" stroke="#38bdf8" stroke-width="3" />
    <text x="120" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="end">stage</text>

    <!-- fast-forward arrow -->
    <path d="M 590 72 L 590 118" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)" />

    <!-- production line -->
    <line x1="150" y1="130" x2="650" y2="130" stroke="#10b981" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" />
    <circle cx="590" cy="130" r="9" fill="#10b981" stroke="#10b981" stroke-width="3" />
    <text x="120" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#10b981" text-anchor="end">production</text>
    <text x="590" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">v1.0.0</text>
  </g>

  <!-- Badge -->
  <g transform="translate(400, 255)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1.5">GIT WORKFLOW</text>
  </g>

  <!-- Title -->
  <text x="400" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">
    stage → production
  </text>

  <!-- Subtitle -->
  <text x="400" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle">
    git push origin stage:production
  </text>

  <!-- Footer Branding -->
  <g transform="translate(400, 400)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">
      NUXFIRE ENTERPRISE ARCHITECTURE
    </text>
  </g>
</svg>
