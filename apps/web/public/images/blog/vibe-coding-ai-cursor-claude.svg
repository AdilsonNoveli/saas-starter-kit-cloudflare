<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="400" cy="180" r="320" fill="url(#glow)" />

  <!-- Code/Tech geometric decorative element -->
  <g opacity="0.12" stroke="#ec4899" stroke-width="1.5" fill="none">
    <circle cx="720" cy="80" r="140" />
    <circle cx="720" cy="80" r="90" />
    <polygon points="60,380 120,280 180,380" />
    <rect x="80" y="40" width="100" height="100" rx="20" />
  </g>

  <!-- Central Icon Container -->
  <g transform="translate(360, 80)">
    <rect width="80" height="80" rx="20" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.4))" />
    <g transform="translate(16, 16)">
      <rect x="3" y="11" width="18" height="10" rx="2" fill="none" stroke="#ec4899" stroke-width="2.5"/><circle cx="12" cy="5" r="2" stroke="#ec4899" stroke-width="2.5" fill="none"/><path d="M12 7v4M8 16h.01M16 16h.01" stroke="#ec4899" stroke-width="3" stroke-linecap="round" transform="scale(2)"/>
    </g>
  </g>

  <!-- Badge -->
  <g transform="translate(400, 205)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ec4899" text-anchor="middle" letter-spacing="1.5">DESENVOLVIMENTO IA</text>
  </g>

  <!-- Title -->
  <text x="400" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">
    Vibe Coding com IA: Cursor &amp; Claude Code
  </text>

  <!-- Subtitle -->
  <text x="400" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Como a Arquitetura NuxFire Elimina Alucinações de LLMs
  </text>

  <!-- Footer Branding -->
  <g transform="translate(400, 395)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">
      NUXFIRE ENTERPRISE ARCHITECTURE
    </text>
  </g>
</svg>