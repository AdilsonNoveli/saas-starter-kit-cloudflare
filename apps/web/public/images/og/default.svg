<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="400" cy="180" r="320" fill="url(#glow)" />

  <!-- Decorative geometry -->
  <g opacity="0.12" stroke="#10b981" stroke-width="1.5" fill="none">
    <circle cx="720" cy="80" r="140" />
    <circle cx="720" cy="80" r="90" />
    <polygon points="60,380 120,280 180,380" />
    <rect x="80" y="40" width="100" height="100" rx="20" />
  </g>

  <!-- Central Icon Container -->
  <g transform="translate(360, 70)">
    <rect width="80" height="80" rx="20" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" stroke-width="2" />
    <g transform="translate(16, 16)">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="scale(2)"/>
    </g>
  </g>

  <!-- Badge -->
  <g transform="translate(400, 195)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1.5">NUXT STARTER KIT</text>
  </g>

  <!-- Title -->
  <text x="400" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-1">
    Nuxfire
  </text>

  <!-- Subtitle -->
  <text x="400" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Production-ready, enterprise-grade SaaS on Cloudflare Workers
  </text>

  <!-- Footer Branding -->
  <g transform="translate(400, 395)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">
      NUXFIRE ENTERPRISE ARCHITECTURE
    </text>
  </g>
</svg>
