<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" width="100%" height="100%" style="max-width: 100%; height: auto; display: block; margin: 0 auto;" font-family="'Geist', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#818cf8"/>
    </marker>

    <!-- Card Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ================= CLEAN CONNECTION PATHS ================= -->
  <!-- 1. Client -> Application -->
  <path d="M 155 310 L 220 310" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 2. Application -> Realtime DO (Upper middle) -->
  <path d="M 640 210 C 685 210 685 145 730 145" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 3. Application -> Queues (Lower middle) -->
  <path d="M 640 410 C 685 410 685 475 730 475" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- 4. Realtime DO -> Postgres (Upper flow) -->
  <path d="M 990 145 L 1035 145" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>

  <!-- 5. Queues -> Storage & Services (Lower flow) -->
  <path d="M 990 475 L 1035 475" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-orange)"/>

  <!-- 6. Application -> Postgres (Direct through Hyperdrive corridor) -->
  <path d="M 640 270 C 820 270 850 200 1035 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 7. Application -> Storage & Services (Direct corridor) -->
  <path d="M 640 350 C 820 350 850 420 1035 420" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ================= CARD 1: CLIENT ================= -->
  <g transform="translate(20, 210)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="135" height="200" rx="10" fill="#14151a" stroke="#282a36" stroke-width="1.2"/>
    <!-- Header pill -->
    <rect x="0" y="0" width="135" height="28" rx="10" fill="#1e2029"/>
    <rect x="0" y="16" width="135" height="12" fill="#1e2029"/>
    <circle cx="14" cy="14" r="3" fill="#ef4444"/>
    <circle cx="23" cy="14" r="3" fill="#f59e0b"/>
    <circle cx="32" cy="14" r="3" fill="#10b981"/>

    <!-- Icon -->
    <g transform="translate(47, 45)">
      <circle cx="20" cy="20" r="18" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="12" y="12" width="16" height="12" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="16" y1="27" x2="24" y2="27" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <text x="67" y="112" font-size="14" font-weight="700" fill="#fafafa" text-anchor="middle">Client</text>
    <text x="67" y="130" font-size="11" fill="#94a3b8" text-anchor="middle">Browser · Mobile</text>

    <line x1="15" y1="145" x2="120" y2="145" stroke="#282a36" stroke-width="1"/>
    <rect x="18" y="157" width="99" height="22" rx="4" fill="#1c1e27" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="67" y="172" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" fill="#38bdf8" text-anchor="middle">HTTPS · WSS</text>
  </g>

  <!-- ================= CARD 2: APPLICATION (ONE UNIFIED 4-IN-1 CARD!) ================= -->
  <g transform="translate(225, 30)" filter="url(#cardShadow)">
    <!-- Main Outer Application Card -->
    <rect x="0" y="0" width="415" height="560" rx="12" fill="#131418" stroke="#10b981" stroke-width="1.5"/>

    <!-- Header bar -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 403 0 C 409.63 0 415 5.37 415 12 L 415 52 L 0 52 Z" fill="#181a20"/>
    <line x1="0" y1="52" x2="415" y2="52" stroke="#282a36" stroke-width="1"/>

    <rect x="16" y="14" width="24" height="24" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <path d="M 28 19 L 35 31 L 21 31 Z" fill="none" stroke="#10b981" stroke-width="1.6" stroke-linejoin="round"/>

    <text x="48" y="28" font-size="14" font-weight="700" fill="#fafafa">Application</text>
    <text x="48" y="42" font-size="10" font-family="'Geist Mono', monospace" fill="#10b981">100% Cloudflare Edge · Zero Cold Starts</text>
    
    <rect x="305" y="16" width="94" height="20" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.8"/>
    <text x="352" y="30" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700" fill="#34d399" text-anchor="middle">4 IN 1 CORE</text>

    <!-- Sub-Part 1: Web Worker (Marketing & Docs) -->
    <g transform="translate(16, 68)">
      <rect x="0" y="0" width="383" height="105" rx="8" fill="#1a1c23" stroke="#2d303d" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="3" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
      <circle cx="23" cy="23" r="5" fill="none" stroke="#0ea5e9" stroke-width="1.4"/>
      
      <text x="42" y="22" font-size="12.5" font-weight="700" fill="#fafafa">1. Web Worker</text>
      <text x="42" y="33" font-size="9" font-family="'Geist Mono', monospace" fill="#38bdf8">nuxfire.com</text>

      <text x="12" y="58" font-size="11" font-weight="600" fill="#e2e8f0">Nuxt 4 Marketing &amp; Documentation</text>
      <text x="12" y="74" font-size="10" fill="#94a3b8">• Nuxt Content v3 with Markdown CMS</text>
      <text x="12" y="90" font-size="10" fill="#94a3b8">• D1 SQL Full-Text Search (Ctrl+K) &amp; Blog</text>
    </g>

    <!-- Sub-Part 2: Auth Worker (OpenAuth.js & Login) -->
    <g transform="translate(16, 185)">
      <rect x="0" y="0" width="383" height="110" rx="8" fill="#1a1c23" stroke="#2d303d" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1"/>
      <rect x="17" y="20" width="12" height="9" rx="1" fill="none" stroke="#818cf8" stroke-width="1.4"/>
      <path d="M 20 20 V 17 C 20 15 26 15 26 17 V 20" fill="none" stroke="#818cf8" stroke-width="1.4"/>

      <text x="42" y="22" font-size="12.5" font-weight="700" fill="#fafafa">2. Auth Worker &amp; Login</text>
      <text x="42" y="33" font-size="9" font-family="'Geist Mono', monospace" fill="#a5b4fc">auth.nuxfire.com</text>

      <text x="12" y="58" font-size="11" font-weight="600" fill="#e2e8f0">OpenAuth.js Engine &amp; Identity</text>
      <text x="12" y="74" font-size="10" fill="#94a3b8">• GitHub &amp; Google OAuth + Email OTP</text>
      <text x="12" y="90" font-size="10" fill="#94a3b8">• Zero-DB Sessions cached directly in KV</text>
    </g>

    <!-- Sub-Part 3: App Worker (Multi-tenant SaaS & APIs) -->
    <g transform="translate(16, 307)">
      <rect x="0" y="0" width="383" height="130" rx="8" fill="#1a1c23" stroke="#10b981" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <rect x="16" y="16" width="14" height="14" rx="2" fill="none" stroke="#10b981" stroke-width="1.4"/>
      <line x1="16" y1="21" x2="30" y2="21" stroke="#10b981" stroke-width="1.2"/>

      <text x="42" y="22" font-size="12.5" font-weight="700" fill="#fafafa">3. App Worker (SaaS Core)</text>
      <text x="42" y="33" font-size="9" font-family="'Geist Mono', monospace" fill="#34d399">app.nuxfire.com</text>

      <text x="12" y="58" font-size="11" font-weight="600" fill="#e2e8f0">Multi-Tenant Business Logic &amp; Dashboards</text>
      <text x="12" y="74" font-size="10" fill="#94a3b8">• End-to-End Type-Safe tRPC APIs &amp; Drizzle ORM</text>
      <text x="12" y="90" font-size="10" fill="#94a3b8">• Tenant Isolation, Roles &amp; Permissions (RBAC)</text>
      <text x="12" y="106" font-size="10" fill="#94a3b8">• Platform Admin (/admin) protected with TOTP MFA</text>
    </g>

    <!-- Sub-Part 4: AuthKV & State Storage -->
    <g transform="translate(16, 449)">
      <rect x="0" y="0" width="383" height="92" rx="8" fill="#1a1c23" stroke="#2d303d" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="3" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="23" cy="23" r="5" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
      <path d="M 23 18 V 23 L 26 26" stroke="#f59e0b" stroke-width="1.2"/>

      <text x="42" y="22" font-size="12.5" font-weight="700" fill="#fafafa">4. Edge KV &amp; Security State</text>
      <text x="42" y="33" font-size="9" font-family="'Geist Mono', monospace" fill="#fbbf24">Cloudflare KV Namespace</text>

      <text x="12" y="58" font-size="10" fill="#94a3b8">• Persistent anti-brute-force rate limiting</text>
      <text x="12" y="74" font-size="10" fill="#94a3b8">• Multi-tiered session keys &amp; encrypted TOTP secrets</text>
    </g>
  </g>

  <!-- ================= COLUMN 3: REALTIME & QUEUES (FLOATING CARDS) ================= -->
  <!-- Card 3A: Realtime Engine (Durable Objects) -->
  <g transform="translate(735, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="255" height="175" rx="10" fill="#14151a" stroke="#10b981" stroke-width="1.2"/>
    <rect x="14" y="14" width="26" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <path d="M 27 18 L 22 26 L 27 26 L 24 34 L 32 24 L 27 24 Z" fill="none" stroke="#10b981" stroke-width="1.4"/>

    <text x="48" y="26" font-size="13" font-weight="700" fill="#fafafa">Realtime Engine</text>
    <text x="48" y="38" font-size="9.5" font-family="'Geist Mono', monospace" fill="#34d399">Cloudflare Durable Objects</text>

    <text x="14" y="66" font-size="11" font-weight="600" fill="#e2e8f0">Stateful WebSocket Hub</text>
    <text x="14" y="84" font-size="10" fill="#94a3b8">• Embedded SQLite per room</text>
    <text x="14" y="100" font-size="10" fill="#94a3b8">• HMAC-signed ticket handshake</text>
    <text x="14" y="116" font-size="10" fill="#94a3b8">• Sub-50ms global latency</text>

    <rect x="14" y="132" width="227" height="24" rx="4" fill="#1c1e27"/>
    <text x="127" y="148" font-size="9.5" font-family="'Geist Mono', monospace" fill="#6ee7b7" text-anchor="middle">Presence · Chat · Live Events</text>
  </g>

  <!-- Card 3B: Asynchronous Queues & DLQ -->
  <g transform="translate(735, 385)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="255" height="175" rx="10" fill="#14151a" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="14" y="14" width="26" height="26" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <path d="M 27 20 L 19 24 L 27 28 L 35 24 Z" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    <path d="M 19 28 L 27 32 L 35 28" fill="none" stroke="#f59e0b" stroke-width="1.4"/>

    <text x="48" y="26" font-size="13" font-weight="700" fill="#fafafa">Async Job Queues</text>
    <text x="48" y="38" font-size="9.5" font-family="'Geist Mono', monospace" fill="#fbbf24">Cloudflare Queues &amp; DLQ</text>

    <text x="14" y="66" font-size="11" font-weight="600" fill="#e2e8f0">Background Workers</text>
    <text x="14" y="84" font-size="10" fill="#94a3b8">• Exponential backoff retries</text>
    <text x="14" y="100" font-size="10" fill="#94a3b8">• Dead Letter Queue (JobDLQ)</text>
    <text x="14" y="116" font-size="10" fill="#94a3b8">• Scheduled hourly cron jobs</text>

    <rect x="14" y="132" width="227" height="24" rx="4" fill="#1c1e27"/>
    <text x="127" y="148" font-size="9.5" font-family="'Geist Mono', monospace" fill="#fcd34d" text-anchor="middle">Heavy AI &amp; Async Tasks</text>
  </g>

  <!-- ================= COLUMN 4: DATA & SERVICES (FLOATING CARDS) ================= -->
  <!-- Card 4A: PostgreSQL via Hyperdrive -->
  <g transform="translate(1040, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="260" height="225" rx="10" fill="#14151a" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="14" y="14" width="26" height="26" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <ellipse cx="27" cy="22" rx="8" ry="3" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
    <path d="M 19 22 V 32 C 19 35 35 35 35 32 V 22" fill="none" stroke="#38bdf8" stroke-width="1.4"/>

    <text x="48" y="26" font-size="13" font-weight="700" fill="#fafafa">PostgreSQL Database</text>
    <text x="48" y="38" font-size="9.5" font-family="'Geist Mono', monospace" fill="#38bdf8">Cloudflare Hyperdrive</text>

    <text x="14" y="66" font-size="11" font-weight="600" fill="#e2e8f0">Edge TCP Connection Pooling</text>
    <text x="14" y="84" font-size="10" fill="#94a3b8">• Persistent connections across edge</text>
    <text x="14" y="100" font-size="10" fill="#94a3b8">• Prevents DB connection crashes</text>
    <text x="14" y="116" font-size="10" fill="#94a3b8">• Supabase · RDS · Neon · Local PG</text>
    <text x="14" y="132" font-size="10" fill="#94a3b8">• Automated Drizzle ORM Migrations</text>

    <rect x="14" y="148" width="232" height="60" rx="4" fill="#1c1e27"/>
    <text x="22" y="166" font-size="8.5" font-family="'Geist Mono', monospace" fill="#94a3b8">Tables Seeded on Deploy:</text>
    <text x="22" y="182" font-size="8" font-family="'Geist Mono', monospace" fill="#7dd3fc">users · teams · roles · permissions</text>
    <text x="22" y="197" font-size="8" font-family="'Geist Mono', monospace" fill="#7dd3fc">plans · benefits · audit_logs · jobs</text>
  </g>

  <!-- Card 4B: Cloud Storage, Billing & Emails -->
  <g transform="translate(1040, 335)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="260" height="225" rx="10" fill="#14151a" stroke="#818cf8" stroke-width="1.2"/>
    <rect x="14" y="14" width="26" height="26" rx="4" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1"/>
    <rect x="18" y="20" width="18" height="14" rx="2" fill="none" stroke="#818cf8" stroke-width="1.4"/>
    <line x1="18" y1="25" x2="36" y2="25" stroke="#818cf8" stroke-width="1.2"/>

    <text x="48" y="26" font-size="13" font-weight="700" fill="#fafafa">Storage &amp; Services</text>
    <text x="48" y="38" font-size="9.5" font-family="'Geist Mono', monospace" fill="#a5b4fc">Storage · Payments · Email</text>

    <text x="14" y="66" font-size="11" font-weight="600" fill="#e2e8f0">Cloudflare R2 Object Storage</text>
    <text x="14" y="82" font-size="10" fill="#94a3b8">• S3-compatible blobs with zero egress fees</text>

    <text x="14" y="106" font-size="11" font-weight="600" fill="#e2e8f0">Stripe Billing &amp; Webhooks</text>
    <text x="14" y="122" font-size="10" fill="#94a3b8">• Subscriptions, portal &amp; checkout</text>

    <text x="14" y="146" font-size="11" font-weight="600" fill="#e2e8f0">Transactional Email Engine</text>
    <text x="14" y="162" font-size="10" fill="#94a3b8">• React Email with Resend / Brevo / SES</text>

    <rect x="14" y="178" width="232" height="32" rx="4" fill="#1c1e27"/>
    <text x="130" y="198" font-size="9.5" font-family="'Geist Mono', monospace" fill="#c7d2fe" text-anchor="middle">SST v4 Declarative Cloud IaC</text>
  </g>
</svg>
