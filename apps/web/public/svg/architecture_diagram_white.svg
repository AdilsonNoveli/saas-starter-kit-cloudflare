<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" width="100%" height="100%" style="max-width: 100%; height: auto; display: block; margin: 0 auto;" font-family="'Geist', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Arrowhead Markers (Vibrant, high-contrast for light mode) -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#6366f1"/>
    </marker>

    <!-- Card Drop Shadows (Soft, subtle elevation for light mode) -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- ================= CLEAN CONNECTION PATHS ================= -->
  <!-- 1. Client -> Application -->
  <path d="M 155 310 L 220 310" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 2. Application -> Realtime DO (Upper middle) -->
  <path d="M 640 210 C 685 210 685 145 730 145" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 3. Application -> Queues (Lower middle) -->
  <path d="M 640 410 C 685 410 685 475 730 475" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- 4. Realtime DO -> Postgres (Upper flow) -->
  <path d="M 990 145 L 1035 145" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>

  <!-- 5. Queues -> Storage & Services (Lower flow) -->
  <path d="M 990 475 L 1035 475" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-orange)"/>

  <!-- 6. Application -> Postgres (Direct through Hyperdrive corridor) -->
  <path d="M 640 270 C 820 270 850 200 1035 200" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 7. Application -> Storage & Services (Direct corridor) -->
  <path d="M 640 350 C 820 350 850 420 1035 420" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ================= CARD 1: CLIENT ================= -->
  <g transform="translate(20, 210)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="135" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header pill -->
    <rect x="0" y="0" width="135" height="28" rx="10" fill="#f8fafc"/>
    <rect x="0" y="16" width="135" height="12" fill="#f8fafc"/>
    <circle cx="14" cy="14" r="3" fill="#ef4444"/>
    <circle cx="23" cy="14" r="3" fill="#f59e0b"/>
    <circle cx="32" cy="14" r="3" fill="#10b981"/>

    <!-- Icon -->
    <g transform="translate(47, 45)">
      <circle cx="20" cy="20" r="18" fill="#0284c7" fill-opacity="0.08" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="12" y="12" width="16" height="12" rx="2" fill="none" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="16" y1="27" x2="24" y2="27" stroke="#0284c7" stroke-width="1.5"/>
    </g>

    <text x="67" y="112" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
    <text x="67" y="130" font-size="11" fill="#64748b" text-anchor="middle">Browser · Mobile</text>

    <line x1="15" y1="145" x2="120" y2="145" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="18" y="157" width="99" height="22" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="67" y="172" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" fill="#0284c7" text-anchor="middle">HTTPS · WSS</text>
  </g>

  <!-- ================= CARD 2: APPLICATION (ONE UNIFIED 4-IN-1 CARD!) ================= -->
  <g transform="translate(225, 30)" filter="url(#cardShadow)">
    <!-- Main Outer Application Card -->
    <rect x="0" y="0" width="415" height="560" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>

    <!-- Header bar -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 403 0 C 409.63 0 415 5.37 415 12 L 415 52 L 0 52 Z" fill="#f0fdf4"/>
    <line x1="0" y1="52" x2="415" y2="52" stroke="#dcfce7" stroke-width="1"/>

    <rect x="16" y="14" width="24" height="24" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
    <path d="M 28 19 L 35 31 L 21 31 Z" fill="none" stroke="#059669" stroke-width="1.6" stroke-linejoin="round"/>

    <text x="48" y="28" font-size="14" font-weight="700" fill="#0f172a">Application</text>
    <text x="48" y="42" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" fill="#059669">100% Cloudflare Edge · Zero Cold Starts</text>
    
    <rect x="305" y="16" width="94" height="20" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="352" y="30" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700" fill="#059669" text-anchor="middle">4 IN 1 CORE</text>

    <!-- Sub-Part 1: Web Worker (Marketing & Docs) -->
    <g transform="translate(16, 68)">
      <rect x="0" y="0" width="383" height="105" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="3" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1"/>
      <circle cx="23" cy="23" r="5" fill="none" stroke="#0284c7" stroke-width="1.4"/>
      
      <text x="42" y="22" font-size="12.5" font-weight="700" fill="#0f172a">1. Web Worker</text>
      <text x="42" y="33" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" fill="#0284c7">nuxfire.com</text>

      <text x="12" y="58" font-size="11" font-weight="600" fill="#1e293b">Nuxt 4 Marketing &amp; Documentation</text>
      <text x="12" y="74" font-size="10" fill="#64748b">• Nuxt Content v3 with Markdown CMS</text>
      <text x="12" y="90" font-size="10" fill="#64748b">• D1 SQL Full-Text Search (Ctrl+K) &amp; Blog</text>
    </g>

    <!-- Sub-Part 2: Auth Worker (OpenAuth.js & Login) -->
    <g transform="translate(16, 185)">
      <rect x="0" y="0" width="383" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="3" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1"/>
      <rect x="17" y="20" width="12" height="9" rx="1" fill="none" stroke="#6366f1" stroke-width="1.4"/>
      <path d="M 20 20 V 17 C 20 15 26 15 26 17 V 20" fill="none" stroke="#6366f1" stroke-width="1.4"/>

      <text x="42" y="22" font-size="12.5" font-weight="700" fill="#0f172a">2. Auth Worker &amp; Login</text>
      <text x="42" y="33" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" fill="#4f46e5">auth.nuxfire.com</text>

      <text x="12" y="58" font-size="11" font-weight="600" fill="#1e293b">OpenAuth.js Engine &amp; Identity</text>
      <text x="12" y="74" font-size="10" fill="#64748b">• GitHub &amp; Google OAuth + Email OTP</text>
      <text x="12" y="90" font-size="10" fill="#64748b">• Zero-DB Sessions cached directly in KV</text>
    </g>

    <!-- Sub-Part 3: App Worker (Multi-tenant SaaS & APIs) -->
    <g transform="translate(16, 307)">
      <rect x="0" y="0" width="383" height="130" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="3" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-width="1"/>
      <rect x="16" y="16" width="14" height="14" rx="2" fill="none" stroke="#059669" stroke-width="1.4"/>
      <line x1="16" y1="21" x2="30" y2="21" stroke="#059669" stroke-width="1.2"/>

      <text x="42" y="22" font-size="12.5" font-weight="700" fill="#0f172a">3. App Worker (SaaS Core)</text>
      <text x="42" y="33" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" fill="#059669">app.nuxfire.com</text>

      <text x="12" y="58" font-size="11" font-weight="600" fill="#1e293b">Multi-Tenant Business Logic &amp; Dashboards</text>
      <text x="12" y="74" font-size="10" fill="#64748b">• End-to-End Type-Safe tRPC APIs &amp; Drizzle ORM</text>
      <text x="12" y="90" font-size="10" fill="#64748b">• Tenant Isolation, Roles &amp; Permissions (RBAC)</text>
      <text x="12" y="106" font-size="10" fill="#64748b">• Platform Admin (/admin) protected with TOTP MFA</text>
    </g>

    <!-- Sub-Part 4: AuthKV & State Storage -->
    <g transform="translate(16, 449)">
      <rect x="0" y="0" width="383" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="12" width="22" height="22" rx="3" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="1"/>
      <circle cx="23" cy="23" r="5" fill="none" stroke="#d97706" stroke-width="1.4"/>
      <path d="M 23 18 V 23 L 26 26" stroke="#d97706" stroke-width="1.2"/>

      <text x="42" y="22" font-size="12.5" font-weight="700" fill="#0f172a">4. Edge KV &amp; Security State</text>
      <text x="42" y="33" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" fill="#d97706">Cloudflare KV Namespace</text>

      <text x="12" y="58" font-size="10" fill="#64748b">• Persistent anti-brute-force rate limiting</text>
      <text x="12" y="74" font-size="10" fill="#64748b">• Multi-tiered session keys &amp; encrypted TOTP secrets</text>
    </g>
  </g>

  <!-- ================= COLUMN 3: REALTIME & QUEUES (FLOATING CARDS) ================= -->
  <!-- Card 3A: Realtime Engine (Durable Objects) -->
  <g transform="translate(735, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="255" height="175" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
    <rect x="14" y="14" width="26" height="26" rx="4" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-width="1"/>
    <path d="M 27 18 L 22 26 L 27 26 L 24 34 L 32 24 L 27 24 Z" fill="none" stroke="#059669" stroke-width="1.4"/>

    <text x="48" y="26" font-size="13" font-weight="700" fill="#0f172a">Realtime Engine</text>
    <text x="48" y="38" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600" fill="#059669">Cloudflare Durable Objects</text>

    <text x="14" y="66" font-size="11" font-weight="600" fill="#1e293b">Stateful WebSocket Hub</text>
    <text x="14" y="84" font-size="10" fill="#64748b">• Embedded SQLite per room</text>
    <text x="14" y="100" font-size="10" fill="#64748b">• HMAC-signed ticket handshake</text>
    <text x="14" y="116" font-size="10" fill="#64748b">• Sub-50ms global latency</text>

    <rect x="14" y="132" width="227" height="24" rx="4" fill="#f0fdf4" stroke="#dcfce7" stroke-width="0.8"/>
    <text x="127" y="148" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600" fill="#059669" text-anchor="middle">Presence · Chat · Live Events</text>
  </g>

  <!-- Card 3B: Asynchronous Queues & DLQ -->
  <g transform="translate(735, 385)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="255" height="175" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="14" y="14" width="26" height="26" rx="4" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="1"/>
    <path d="M 27 20 L 19 24 L 27 28 L 35 24 Z" fill="none" stroke="#d97706" stroke-width="1.4"/>
    <path d="M 19 28 L 27 32 L 35 28" fill="none" stroke="#d97706" stroke-width="1.4"/>

    <text x="48" y="26" font-size="13" font-weight="700" fill="#0f172a">Async Job Queues</text>
    <text x="48" y="38" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600" fill="#d97706">Cloudflare Queues &amp; DLQ</text>

    <text x="14" y="66" font-size="11" font-weight="600" fill="#1e293b">Background Workers</text>
    <text x="14" y="84" font-size="10" fill="#64748b">• Exponential backoff retries</text>
    <text x="14" y="100" font-size="10" fill="#64748b">• Dead Letter Queue (JobDLQ)</text>
    <text x="14" y="116" font-size="10" fill="#64748b">• Scheduled hourly cron jobs</text>

    <rect x="14" y="132" width="227" height="24" rx="4" fill="#fffbeb" stroke="#fef3c7" stroke-width="0.8"/>
    <text x="127" y="148" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600" fill="#b45309" text-anchor="middle">Heavy AI &amp; Async Tasks</text>
  </g>

  <!-- ================= COLUMN 4: DATA & SERVICES (FLOATING CARDS) ================= -->
  <!-- Card 4A: PostgreSQL Database -->
  <g transform="translate(1040, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="260" height="225" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="14" y="14" width="26" height="26" rx="4" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1"/>
    <ellipse cx="27" cy="22" rx="8" ry="3" fill="none" stroke="#0284c7" stroke-width="1.4"/>
    <path d="M 19 22 V 32 C 19 35 35 35 35 32 V 22" fill="none" stroke="#0284c7" stroke-width="1.4"/>

    <text x="48" y="26" font-size="13" font-weight="700" fill="#0f172a">PostgreSQL Database</text>
    <text x="48" y="38" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600" fill="#0284c7">Cloudflare Hyperdrive</text>

    <text x="14" y="66" font-size="11" font-weight="600" fill="#1e293b">Edge TCP Connection Pooling</text>
    <text x="14" y="84" font-size="10" fill="#64748b">• Persistent connections across edge</text>
    <text x="14" y="100" font-size="10" fill="#64748b">• Prevents DB connection crashes</text>
    <text x="14" y="116" font-size="10" fill="#64748b">• Supabase · RDS · Neon · Local PG</text>
    <text x="14" y="132" font-size="10" fill="#64748b">• Automated Drizzle ORM Migrations</text>

    <rect x="14" y="148" width="232" height="60" rx="4" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="0.8"/>
    <text x="22" y="166" font-size="8.5" font-family="'Geist Mono', monospace" fill="#64748b">Tables Seeded on Deploy:</text>
    <text x="22" y="182" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" fill="#0284c7">users · teams · roles · permissions</text>
    <text x="22" y="197" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" fill="#0284c7">plans · benefits · audit_logs · jobs</text>
  </g>

  <!-- Card 4B: Cloud Storage, Billing & Emails -->
  <g transform="translate(1040, 335)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="260" height="225" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
    <rect x="14" y="14" width="26" height="26" rx="4" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1"/>
    <rect x="18" y="20" width="18" height="14" rx="2" fill="none" stroke="#6366f1" stroke-width="1.4"/>
    <line x1="18" y1="25" x2="36" y2="25" stroke="#6366f1" stroke-width="1.2"/>

    <text x="48" y="26" font-size="13" font-weight="700" fill="#0f172a">Storage &amp; Services</text>
    <text x="48" y="38" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600" fill="#4f46e5">Storage · Payments · Email</text>

    <text x="14" y="66" font-size="11" font-weight="600" fill="#1e293b">Cloudflare R2 Object Storage</text>
    <text x="14" y="82" font-size="10" fill="#64748b">• S3-compatible blobs with zero egress fees</text>

    <text x="14" y="106" font-size="11" font-weight="600" fill="#1e293b">Stripe Billing &amp; Webhooks</text>
    <text x="14" y="122" font-size="10" fill="#64748b">• Subscriptions, portal &amp; checkout</text>

    <text x="14" y="146" font-size="11" font-weight="600" fill="#1e293b">Transactional Email Engine</text>
    <text x="14" y="162" font-size="10" fill="#64748b">• React Email with Resend / Brevo / SES</text>

    <rect x="14" y="178" width="232" height="32" rx="4" fill="#eef2ff" stroke="#e0e7ff" stroke-width="0.8"/>
    <text x="130" y="198" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600" fill="#4f46e5" text-anchor="middle">SST v4 Declarative Cloud IaC</text>
  </g>
</svg>
